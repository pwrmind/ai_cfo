[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-cfo"
version = "0.1.0"
description = "AI-powered financial statement analyzer and business forecasting tool for 1C bank statements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.0",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
ai-cfo = "main:main"

[tool.setuptools]
py-modules = ["main"]